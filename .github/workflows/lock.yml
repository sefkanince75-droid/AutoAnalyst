name: Verify dependency lock (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed dependency graph without changing the repository
        run: uv lock --check --python 3.12
