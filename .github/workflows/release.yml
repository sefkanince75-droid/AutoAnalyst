name: V2 pre-release package validation

on:
  workflow_dispatch:
  push:
    branches:
      - v2-completion
      - 'codex/**'
  pull_request:
    branches: [main]

concurrency:
  group: pre-release-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync frozen release environment
        run: uv sync --frozen --group dev --group desktop
      - name: Install browser for real UI startup validation
        run: uv run --frozen playwright install chromium
      - name: Full regression suite
        run: uv run pytest -q
      - name: Build wheel and source distribution
        run: uv run python -m build
      - name: Generate release environment manifest
        shell: pwsh
        run: |
          uv run python tools/release_manifest.py | Out-File -Encoding utf8 .\dist\release-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item .\uv.lock .\dist\uv.lock
      - name: Build portable Windows executable
        shell: pwsh
        run: >-
          uv run --frozen --group desktop python tools/build_release.py
      - name: Offline executable smoke test
        shell: pwsh
        run: |
          $env:NO_PROXY = "localhost,127.0.0.1"
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          .\dist\AutoAnalyst.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\AutoAnalyst.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real executable HTTP assets websocket and browser validation
        run: uv run --frozen python tools/check_startup.py --executable dist/AutoAnalyst.exe --output build/startup-check.json --screenshot build/startup-ui.png
      - name: Real native WebView2 desktop window validation
        # WebView2 verifies a real desktop window, beyond HTTP/backend smoke tests.
        # Keep the workspace isolated from any developer/user installation.
        shell: pwsh
        run: |
          uv run --frozen python tools/check_native.py --executable dist/AutoAnalyst.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create portable archive
        shell: pwsh
        run: >-
          Compress-Archive
          -Path .\dist\AutoAnalyst.exe,.\dist\uv.lock,.\dist\release-manifest.json
          -DestinationPath .\dist\AutoAnalyst-Windows-x64.zip
          -Force
      - uses: actions/upload-artifact@v4
        with:
          name: autoanalyst-v2-windows-x64
          path: |
            dist/AutoAnalyst-Windows-x64.zip
            dist/release-manifest.json
            dist/uv.lock
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
