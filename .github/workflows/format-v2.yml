name: One-shot V2 formatter

on:
  push:
    branches: [v2-completion]
    paths:
      - ".github/workflows/format-v2.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-completion
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - name: Apply narrow snapshot typing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/autoanalyst/application/snapshots.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("from uuid import uuid4\n", "from typing import Any\nfrom uuid import uuid4\n", 1)
          text = text.replace(
              "def _extract_and_verify(snapshot: Path, destination: Path) -> dict[str, object]:",
              "def _extract_and_verify(snapshot: Path, destination: Path) -> dict[str, Any]:",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format V2 Python sources
        run: uv run ruff format src/autoanalyst tests/v2 tools
      - name: Verify lint after formatting
        run: uv run ruff check src/autoanalyst tests/v2 tools
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autoanalyst tests/v2 tools
          git commit -m "fix(v2): type snapshot manifest shape"
          git push origin HEAD:v2-completion
