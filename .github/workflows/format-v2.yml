name: One-shot V2 formatter

on:
  push:
    branches: [v2-completion]
    paths:
      - ".github/workflows/format-v2.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-completion
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - name: Format V2 Python sources
        run: uv run ruff format src/autoanalyst tests/v2 tools
      - name: Verify lint after formatting
        run: uv run ruff check src/autoanalyst tests/v2 tools
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autoanalyst tests/v2 tools
          git commit -m "style(v2): apply Ruff formatter"
          git push origin HEAD:v2-completion
