name: CI

on:
  push:
    branches: [main, v2-completion]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen dependency graph
        run: uv lock --check
      - name: Sync development environment
        run: uv sync --frozen --group dev
      - name: Compile
        run: uv run python -m compileall -q src app.py legacy_app.py
      - name: Run tests
        run: uv run pytest -q
      - name: Build wheel and sdist
        run: uv run python -m build
      - name: Verify package import
        run: uv run python -c "import autoanalyst; print(autoanalyst.__version__)"
