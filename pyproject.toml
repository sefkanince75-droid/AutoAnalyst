[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoanalyst"
version = "2.0.0rc1"
description = "Local-first deterministic analytics workspace for tabular data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "Sefkan İnce"}]
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "scikit-learn>=1.3,<2.0",
  "matplotlib>=3.7,<4.0",
  "streamlit>=1.30,<2.0",
  "joblib>=1.3,<2.0",
  "scipy>=1.10,<2.0",
  "openpyxl>=3.1,<4.0",
  "pyarrow>=14.0,<25.0",
  "duckdb>=1.1,<2.0",
  "psutil>=5.9,<8.0",
]

[project.scripts]
autoanalyst-worker = "autoanalyst.execution.worker:main"

[dependency-groups]
dev = [
  "pytest>=7.4,<9.0",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<0.14",
  "mypy>=1.17,<1.20",
  "build>=1.2,<2",
]
desktop = [
  "pyinstaller>=6.15,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["autoanalyst*"]

[tool.setuptools.package-data]
"autoanalyst.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["legacy_app.py", "src/i18n.py", "src/locales_v11.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["autoanalyst"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^legacy_app\\.py$", "^src/(?!autoanalyst/)"]

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "scipy.*", "duckdb.*", "pyarrow.*", "streamlit.*", "joblib.*", "psutil.*"]
ignore_missing_imports = true
